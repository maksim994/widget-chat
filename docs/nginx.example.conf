# Пример reverse proxy для Widget Chat.
# Замените домены, пути к dist кабинета и перезагрузите nginx: sudo nginx -t && sudo systemctl reload nginx

upstream widget_api {
    server 127.0.0.1:3001;
    keepalive 32;
}

# API, WebSocket, widget.js
server {
    listen 80;
    server_name api.example.com;

    location / {
        proxy_pass http://widget_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://widget_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 86400;
    }
}

# Кабинет (статика) + опционально API на том же origin
server {
    listen 80;
    server_name cabinet.example.com;

    root /var/www/widget-cabinet/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass http://widget_api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /socket.io/ {
        proxy_pass http://widget_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400;
    }

    location /widget.js {
        proxy_pass http://widget_api;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=300";
    }
}

# packages/api/.env (вариант A — отдельный API-домен):
#   CORS_ORIGIN=https://cabinet.example.com
#   PUBLIC_API_URL=https://api.example.com
#
# Вариант B — один домен кабинета, API под /api:
#   PUBLIC_API_URL=https://cabinet.example.com
#   Vite/cabinet: прокси не нужен, fetch на /api/...
